# application.yml duy nhat cua toan he — chi nss-start co src/main/resources
server:
  port: 8080

spring:
  application:
    name: nss-api
  threads:
    virtual:
      # Java 21 virtual threads bat san (architecture/01-overview.md muc 2)
      enabled: true

  datasource:
    # Khong commit mat khau nao: gia tri that doc tu bien moi truong, mac dinh chi de chay dev tren may ca nhan
    # Mac dinh khop container MySQL cua environment/docker-compose-dev.yml: database nssdbs, host port 3316
    # characterEncoding=UTF-8 chu KHONG phai utf8mb4: Connector/J 8.3.0 nhan ten charset cua Java,
    # va no tu map UTF-8 -> utf8mb4 khi noi toi MySQL 8. Dat thang 'utf8mb4' thi driver nem
    # "Unsupported character encoding 'utf8mb4'" ngay truoc khi mo duoc ket noi.
    # preserveInstants=false: BAT BUOC. Mac dinh cua Connector/J la true, nghia la no coi DATETIME
    # nhu mot instant o connectionTimeZone roi QUY DOI sang mui gio cua JVM khi doc/ghi. May dev o
    # Asia/Saigon (UTC+7) nen dong seed 2026-07-02 00:00:00 doc ra thanh 07:00, va gio UTC do
    # LocalDateTime.now(ZoneOffset.UTC) sinh ra bi ghi xuong DB som 7 tieng. Dat false thi DATETIME
    # di qua nguyen ven: thu Java ghi dung bang thu MySQL luu. Lech 7 tieng nay KHONG nem loi nao.
    url: ${DB_URL:jdbc:mysql://localhost:3316/nssdbs?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&preserveInstants=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 100

  mail:
    # Duong gui mail (backlog 0017, ADR 0004). Theo dung nep ${ENV_VAR:dev-default} — khong tao profile moi.
    #
    # MAC DINH TRO TOI SMTP CATCHER trong environment/docker-compose-dev.yml (Mailpit, cong 1025),
    # KHONG phai mot may chu that. Day la lua chon co y: mot cau hinh RONG thi ung dung van len xanh
    # va endpoint van tra 204, chi co dieu khong email nao roi khoi he thong — dung kieu hong IM LANG
    # ma ADR 0004 canh bao. Tro san vao catcher thi luong chay tron ven tren may dev, va giao dien web
    # cua catcher o http://localhost:8025 la cho nhin thay email that.
    #
    # MOI TRUONG THAT BAT BUOC dat MAIL_HOST / MAIL_PORT / MAIL_USERNAME / MAIL_PASSWORD va bat
    # MAIL_SMTP_AUTH=true, MAIL_SMTP_STARTTLS=true. Credential SMTP la bi mat THU HAI cua he thong
    # sau jwt-secret — khong bao gio commit gia tri that vao file nay.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    # Catcher noi bo khong doi xac thuc nen hai dong nay rong o dev; moi truong that thi bat buoc co.
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    # UTF-8 tuong minh: tieu de va than thu co dau tieng Viet.
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          # Khong de mot may chu SMTP cham giu mot luong mai mai. Gui chay bat dong bo nen ba timeout
          # nay khong cham vao thoi gian phan hoi cua endpoint.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  mvc:
    problemdetails:
      # RFC 7807: loi tra ve dang ProblemDetail thay vi body mac dinh {timestamp,status,error,path}
      # (API_CONTRACT muc A.3). Khong bat thi frontend parse sai o 24 cho hien thi loi.
      enabled: true

  jpa:
    hibernate:
      # ADR 0002: entity la nguon chan ly cua schema — chay app la schema hien hanh
      ddl-auto: update
    # Dialect tuy bien de moi bang co DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci (architecture muc 3)
    database-platform: com.nss.ddd.infrastructure.config.MySQLUtf8mb4Dialect
    # Entity khong duoc doc ngoai session: quan he mot chieu LAZY, gom danh sach con la viec cua tang service
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true

# Xac thuc (backlog 0010, ADR 0003). Theo dung nep ${ENV_VAR:dev-default} — khong tao profile moi.
nss:
  auth:
    # CANH BAO: chuoi duoi day CHI danh cho may dev. Bat ky ai co no deu ky duoc access token hop le
    # cho BAT KY tai khoan nao, ke ca ADMIN. Moi truong that BAT BUOC dat bien JWT_SECRET.
    # Toi thieu 32 byte cho HS256; JwtConfig fail ngay luc khoi dong neu ngan hon, chu khong doi
    # den lan dang nhap dau tien moi bao loi.
    jwt-secret: ${JWT_SECRET:nss-dev-only-secret-key-change-me-in-production}
    # TTL la GIA DINH DA NEU RO, khong phai contract: API_CONTRACT muc A.2 chi noi access token
    # 15-60 phut va im lang ve refresh. Dinh dang ISO-8601 Duration.
    access-token-ttl: ${ACCESS_TOKEN_TTL:PT30M}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:P14D}
    # Token dat lai mat khau (backlog 0017). Hop dong IM LANG ve con so nay — no la mot gia dinh da
    # neu ro, khong phai contract.
    # NGAN HON access token (PT30M) la CO CHU Y: mot link nam trong hop thu lau hon rat nhieu so voi
    # mot token trong bo nho trinh duyet, va bat ky ai doc duoc hop thu do — hoac doc duoc mot ban
    # sao lưu cua no — deu doi duoc mat khau. AuthAppServiceImpl fail luc khoi dong neu gia tri
    # khong duong: mot TTL <= 0 khien moi token chet ngay khi vua sinh ra, va khong endpoint nao
    # bao loi ve dieu do.
    password-reset-token-ttl: ${PASSWORD_RESET_TOKEN_TTL:PT15M}
    # Chong do tan suat cho POST /auth/forgot-password (backlog 0017 dieu 8). Dem theo CA hai khoa:
    # IP nguoi goi va email dich — xem javadoc ForgotPasswordRateLimiter ve vi sao thieu mot trong
    # hai la con duong.
    forgot-password-max-attempts: ${FORGOT_PASSWORD_MAX_ATTEMPTS:5}
    forgot-password-window: ${FORGOT_PASSWORD_WINDOW:PT15M}

  # Tran thong luong cua bien vao /api/** (backlog 0021, ADR 0005). Theo dung nep ${ENV_VAR:dev-default}
  # — khong tao profile moi.
  #
  # TRAN THEO NHOM ENDPOINT, KHONG theo nguoi goi: RateLimiter cua Resilience4j la mot be permit gan
  # voi mot ten instance, khong phai map theo IP. No chan QUA TAI. Lop chan LAM DUNG (do tai khoan,
  # phat tan thu rac) van la ForgotPasswordRateLimiter, khoa theo CA IP lan email — hai lop giai hai
  # bai toan khac nhau va ca hai deu o lai.
  #
  # NGUONG LA MOT CON SO VAN HANH: dat thap qua thi tu chan nguoi dung that, dat cao qua thi lop bao
  # ve chi la trang tri. Nam sau bien moi truong de chinh duoc ma khong phai build lai.
  # Nguong <= 0 hoac chu ky <= 0 => FAIL LUC KHOI DONG (ApiRateLimitInterceptor), dung tien le
  # JwtConfig: mot nguong 0 chan moi request ke ca request dau tien nhung van tra dung hinh dang loi
  # nen khong ai nhin ra.
  #
  # timeoutDuration KHONG co o day va do la CO Y: no bi khai cung bang Duration.ZERO trong code. Mac
  # dinh 5 giay cua Resilience4j la XEP HANG chu khong TU CHOI — khong ai nhan 429, moi nguoi cung
  # cham — va hong kieu do khong lam test nao do. Xem javadoc ApiRateLimitInterceptor.
  #
  # Tran la THEO TIEN TRINH: chay N instance thi tran that gap N lan. Khi do cau tra loi la mot be
  # dung chung (Redis), khong phai chinh con so o day.
  rate-limit:
    # /api/auth/**, moi verb. Tier chat nhat: day la cho dang nhap va doi mat khau.
    auth:
      limit-for-period: ${RATE_LIMIT_AUTH_LIMIT:10}
      limit-refresh-period: ${RATE_LIMIT_AUTH_PERIOD:PT1S}
    # POST / PUT / PATCH / DELETE duoi /api/**, ngoai auth.
    write:
      limit-for-period: ${RATE_LIMIT_WRITE_LIMIT:30}
      limit-refresh-period: ${RATE_LIMIT_WRITE_PERIOD:PT1S}
    # Phan con lai duoi /api/**.
    read:
      limit-for-period: ${RATE_LIMIT_READ_LIMIT:100}
      limit-refresh-period: ${RATE_LIMIT_READ_PERIOD:PT1S}

  mail:
    # Dia chi nguoi gui. Fail luc khoi dong neu rong hoac khong chua '@' (MailAppServiceImpl).
    from: ${MAIL_FROM:no-reply@nongsansach.local}
    # Trang dat lai mat khau phia FRONTEND — CHUA TON TAI o thoi diem backlog 0017 dong (lo hong #3
    # nam o repo khac). Dat sau bien moi truong nen no dung ngay khi FE dung trang, va sai mot cach
    # hien nhien — 404 ngay khi bam — neu FE chon duong khac. Token di kem dang ?token=...
    # Fail luc khoi dong neu khong phai mot URL http(s) tuyet doi.
    password-reset-url: ${PASSWORD_RESET_URL:http://localhost:5173/dat-lai-mat-khau}

# Swagger / OpenAPI 3 (backlog 0009). Bat mac dinh, tat duoc bang bien moi truong — khong tao profile moi.
# Hai co tach rieng vi chung tat hai thu khac nhau: api-docs tat endpoint JSON /v3/api-docs,
# swagger-ui tat trang /swagger-ui/index.html.
springdoc:
  api-docs:
    enabled: ${SWAGGER_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}
