# MySQL 8.0 cho moi truong dev — thay cho MySQL80 native tren may ca nhan.
# Mat khau root doc tu environment/.env (gitignored). Copy .env.example -> .env roi dien truoc khi chay.
#
# CO mount ./mysql/init vao /docker-entrypoint-initdb.d/ — Owner chot o backlog/0006.
# Ly do doi: dung container len la co ngay ca schema (01-schema.sql) lan du lieu seed
# (02-seed-data.sql), khong phai boot app roi chay them buoc tay nao. Truoc do khong mount
# nen container moi luon rong 0 ban ghi, khong lam viec duoc voi tang repository va API.
#
# Danh doi da nhin thay va da chap nhan: voi container moi, schema do file .sql tao chu KHONG
# do Hibernate. ADR 0002 khong bi vi pham — 01-schema.sql van la ban ket xuat tu entity va van
# cam sua tay — nhung phep kiem "Hibernate tu sinh schema" khong con chay mac dinh nua.
#   => LUAT DI KEM: sua entity thi SINH LAI 01-schema.sql trong CUNG lan sua do.
#      Quen thi container moi dung schema CU roi ddl-auto=update va phan chenh; `update` chi them,
#      khong xoa cot thua va khong doi kieu cot, nen DB roi vao trang thai lai ma KHONG co gi bao loi.
#
# Luu y: initdb.d chi chay khi datadir RONG. Muon nap lai tu dau thi docker stop + docker rm
# nss-event-mysql, xoa ./data/, roi up -d.

# DUNG XOA dong `name` duoi day. Thieu no thi Compose lay project name tu ten thu muc cha
# (`environment`), trung voi mot stack `pre-event-*` khong lien quan tren cung may: `up` tai tao
# nham service `mysql` cua stack do, con `down` se xoa sach 11 container cua ho. Xem bugs/0001.
name: nss-event

networks:
  ssn-event-network:
    driver: bridge

services:
  mysql:
    image: mysql:8.0
    container_name: nss-event-mysql
    volumes:
      - ./data/db_data:/var/lib/mysql
      # Chay theo thu tu alphabet khi datadir rong: 01-schema.sql roi 02-seed-data.sql.
      - ./mysql/init:/docker-entrypoint-initdb.d/
    command: [
      '--character-set-server=utf8mb4',
      '--collation-server=utf8mb4_unicode_ci',
      '--skip-character-set-client-handshake'  # Buoc tat ca ket noi su dung utf8mb4
    ]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: nssdbs
    ports:
      - "3316:3306"
    healthcheck:
      # $$ de shell trong container tu expand bien, mat khau khong lo ra `docker compose config`
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - ssn-event-network

  # SMTP catcher cho moi truong dev (backlog 0017, ADR 0004).
  #
  # VI SAO CAN NO — va vi sao no khong duoc thay bang "ghi token ra log":
  # POST /auth/forgot-password LUON tra 204, ke ca khi duong gui mail chet hoan toan. Nghia la mot
  # bo test chi nhin ma HTTP se XANH voi mot he thong khong gui duoc email nao. Bang chung cua ticket
  # 0017 vi vay khong phai ma 204 ma la MOT EMAIL THAT DEN NOI, va container nay la cho no den.
  # ADR 0004 co xet phuong an ghi token ra log va loai no lam DICH DEN: thieu mot co tat cung o
  # production thi day la ro token dat lai mat khau vao file log.
  #
  # KHONG PHAI MAY CHU MAIL THAT: Mailpit nhan MOI thu gui toi va KHONG chuyen tiep di dau ca. Do
  # dung la thu can o may dev — khong co nguy co gui nham mail that cho nguoi that trong luc kiem thu.
  # Moi truong that dat MAIL_HOST / MAIL_PORT / MAIL_USERNAME / MAIL_PASSWORD tro toi SMTP that.
  #
  # Ghim phien ban (v1.21) chu khong dung `latest`: mot ban `latest` doi duoi chan lam bang chung
  # kiem chung khong lap lai duoc. Day la IMAGE, khong phai dependency Maven — no khong di qua BOM
  # spring-boot-dependencies va khong them truc bao tri nao vao classpath.
  #
  # Khong mount volume: mail bat duoc song trong RAM va mat khi container bi xoa. Do la co y — noi
  # dung o day la du lieu kiem thu, va mot email dat lai mat khau nam lai tren dia sau khi test xong
  # la mot ban sao cua bi mat ma khong ai con nho la minh dang giu.
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: nss-event-mailpit
    ports:
      # 1025 = SMTP (spring.mail.port tro san vao day); 8025 = giao dien web de NHIN THAY email that
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - ssn-event-network

  # Redis 7.x cho moi truong dev (backlog 0035 Phase 0, architecture/01-overview.md §2/§4/§5).
  #
  # THI HANH TAI LIEU, khong phai mo rong stack: Redis da co ten trong bang stack §2 tu truoc ticket
  # nay (dung cho cache 3 tang + Lua atomic gate chong oversell + Redisson lock chong cache stampede),
  # chi chua co service nao trong file nay. Cung loai viec backlog 0032 da lam cho Kafka.
  #
  # Port host 6390: lech chuan nhu MySQL 3316 / Kafka 9094 — tranh dung voi mot cai dat Redis native
  # tren may dev (mac dinh 6379).
  #
  # KHONG mount volume: day la cache, mat du lieu khi container bi xoa la DUNG Y — Guava/Redis chi la
  # luoi toc do, MySQL moi la nguon su that (architecture §5 "Redis la cong atomic. MySQL la luoi an
  # toan."). Khong dat mat khau o dev, dung nep khong-auth da dung cho mailpit/kafka o file nay.
  redis:
    image: redis:7-alpine
    container_name: nss-event-redis
    ports:
      - "6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ssn-event-network

  # Kafka broker cho moi truong dev (backlog 0032, architecture/01-overview.md §2/§6).
  #
  # KRaft mode, KHONG Zookeeper — dung image chinh chu cua Apache Kafka co ho tro KRaft single-node
  # don gian bang bien moi truong, khop dung stack §2 da ghi ("Kafka 3.7, KRaft mode").
  #
  # HAI LISTENER, khac nhau ve DICH: `PLAINTEXT` (9092) la listener NOI BO container-toi-container
  # (app se KHONG dung listener nay khi chay tren may host — do o day chi de broker tu quang cao dung
  # dia chi trong network); `PLAINTEXT_HOST` (9094) la listener app tren may dev thuc su ket noi toi,
  # dung con so port ma architecture §8 da nhac cho du an tham chieu — giu nep dat port khong chuan
  # nhu MySQL 3316, tranh dung voi mot cai dat Kafka native tren may.
  #
  # AUTO_CREATE_TOPICS bat cho tien dev, nhung topic `order.status-changed` van duoc khai TUONG MINH
  # qua NewTopic bean cua KafkaTopicConfig (3 partition) luc app khoi dong — auto-create chi la luoi
  # an toan neu app chua kip chay truoc consumer/producer nao khac.
  kafka:
    image: apache/kafka:3.7.0
    container_name: nss-event-kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - ssn-event-network

  # Kafka UI cho moi truong dev (backlog 0034) — xem topic/partition/consumer group/message thay
  # vi go kafka-console-producer/consumer tho nhu luc kiem idempotency o backlog 0032.
  #
  # DUNG kafbat/kafka-ui, KHONG DUNG provectuslabs/kafka-ui goc: du an goc da ngung phat trien tu
  # cuoi 2023, kafbat la fork cong dong dang duoc maintain tich cuc va ke thua no.
  #
  # Tro vao listener NOI BO cua broker (kafka:9092, cung PLAINTEXT ma app dung khi chay trong
  # container) — KHONG dung PLAINTEXT_HOST:9094, do la listener cho process chay tren may host.
  #
  # Port host 8089: khong dung voi 3316 (mysql), 1025/8025 (mailpit), 9094 (kafka host listener),
  # va 8080 (Spring Boot app, xem [[intellij-giu-port-8080-va-hikari]]).
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: nss-event-kafka-ui
    ports:
      - "8089:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: nss-event-dev
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - ssn-event-network
